<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impasto</title>
  <link rel="stylesheet" href="css/painter.css">
  <!-- type="module" lets main.js use import/export to load the other files. -->
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!--
    Layout: the painting hangs on a "wall" on the left; the control panel
    sits on the right (or below it on narrow screens).
  -->
  <main class="studio">
    <div class="wall">
      <figure class="frame">
        <!-- The WebGL canvas. Its pixel size is set in main.js; CSS scales it to fit. -->
        <canvas id="painting" aria-label="Painting canvas. Drag to paint."></canvas>
        <p id="status" class="status">Mixing paint…</p>
      </figure>
    </div>

    <aside class="panel" aria-label="Controls">
      <header class="panel__header">
        <h1 class="panel__title">Impasto</h1>
        <p class="panel__intro">Drag on the painting to lay down paint. Move the lamp to see the relief.</p>
      </header>

      <!--
        Tooltips: any element with data-tip="..." gets a hover/focus tooltip
        (built by initTooltips() in js/ui/controls.js). Sliders get theirs
        from the "tip" text in main.js.
      -->
      <section class="group">
        <h2 class="group__title">Light</h2>
        <div class="light-pad-wrap" data-tip="Drag the lamp to move the light. Near the centre, light falls from overhead and the paint looks flatter. Near the rim, light skims across the surface and every ridge throws a shadow.">
          <div id="light-pad" class="light-pad"></div>
        </div>
        <div class="toggle" data-tip="Slowly circles the light around the painting, so you can see the relief from every side.">
          <input type="checkbox" id="orbit">
          <label for="orbit">Orbit the light</label>
        </div>
        <div id="light-controls"></div>
      </section>

      <section class="group">
        <h2 class="group__title">Canvas</h2>
        <div class="control control--ground" data-tip="The colour of the primed canvas under the paint. It shows wherever paint is thin or missing, and it changes instantly, even under paint you've already laid down.">
          <span class="control__label" id="ground-label">Canvas colour</span>
          <!-- Swatches are filled in by main.js from GROUND_SWATCHES. -->
          <div class="swatches" id="ground-swatches" role="group" aria-labelledby="ground-label">
            <input type="color" id="ground-color" aria-label="Custom canvas colour">
          </div>
        </div>
        <div id="canvas-controls"></div>
      </section>

      <section class="group">
        <h2 class="group__title">Test brush</h2>
        <div class="control control--color" data-tip="The colour of the paint on the test brush.">
          <label class="control__label" for="brush-color">Colour</label>
          <input type="color" id="brush-color" value="#1f3a68">
        </div>
        <div id="brush-controls"></div>
      </section>

      <section class="group">
        <h2 class="group__title">View</h2>
        <div class="control control--select" data-tip="Swap the finished view for the data behind it: flat colour with no lighting, the height map (lighter means thicker paint), or surface normals (the colours show which way each bit of paint faces).">
          <label class="control__label" for="view-mode">Show</label>
          <select id="view-mode">
            <option value="0">Lit painting</option>
            <option value="1">Colour only</option>
            <option value="2">Height map</option>
            <option value="3">Surface normals</option>
          </select>
        </div>
        <div class="actions">
          <span data-tip="Clears the canvas and paints a fresh random composition.">
            <button id="test-paint" class="button button--primary">New test painting</button>
          </span>
          <span data-tip="Removes all the paint, leaving bare canvas.">
            <button id="clear" class="button">Clear canvas</button>
          </span>
          <span data-tip="Downloads the painting exactly as shown, at full resolution (1080 × 1350).">
            <button id="save" class="button">Save PNG</button>
          </span>
        </div>
      </section>
    </aside>
  </main>
</body>
</html>
