<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Impasto</title>
  <link rel="stylesheet" href="css/painter.css">
  <!-- type="module" lets main.js use import/export to load the other files. -->
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!--
    Layout: the painting hangs on a "wall" on the left; the control panel
    sits on the right (or below it on narrow screens).

    The panel's contents are built in JavaScript: the tab bar from the list
    of phases in js/main.js, and each tab's sections by its phase file in
    js/phases/ (plus the shared sections in js/ui/shared-sections.js).
  -->
  <main class="studio">
    <div class="wall">
      <figure class="frame">
        <!-- The WebGL canvas. Its pixel size is set in main.js; CSS scales it to fit. -->
        <canvas id="painting" aria-label="Painting canvas. Drag to paint."></canvas>
        <p id="status" class="status">Mixing paint…</p>
      </figure>
    </div>

    <aside class="panel" aria-label="Controls">
      <header class="panel__header">
        <h1 class="panel__title">Impasto</h1>
        <div id="phase-tabs" class="tabs"></div>
        <p id="phase-intro" class="panel__intro"></p>
      </header>
      <div id="phase-panel" role="tabpanel"></div>
    </aside>
  </main>
</body>
</html>
